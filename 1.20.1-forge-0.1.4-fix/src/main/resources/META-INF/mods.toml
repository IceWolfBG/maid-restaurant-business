displayName="Maid Restaurant: Now Open"
authors="IceWolf"
logoFile="maid_restaurant_business.png"
description='''
Maid Restaurant Business - Maid Restaurant: Now Open

Touhou Little Maid x Maid Restaurant x Order to Cook integration addon.

Automated restaurant management with maids:
- Auto order: select orders based on ingredients and value
- Auto cooking: chef maids cook food according to orders
- Auto prep: take ready food from containers to countertop
- Auto packaging: waiter maids pack or plate orders
- Auto delivery: waiter maids deliver plates to customers
- Auto dishwashing: waiter maids collect and wash dirty plates

Unlock automation features by order machine level. Configurable.
'''

